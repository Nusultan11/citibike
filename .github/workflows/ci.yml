name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
      - run: uv sync --locked --group ml
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked --group ml pytest -q tests/unit
      - run: uv run --locked pytest -q tests/data_contracts
      - run: uv run --locked --group ml pytest -q tests/ml
      - run: uv run --locked python -m tests.fixtures_history --data-dir .cache/f2-ci
      - run: uv run --locked python -m citibike.history build --inventory .cache/f2-ci/inventory/controlled.json --data-dir .cache/f2-ci
      - run: uv run --locked python -m citibike.history build --inventory .cache/f2-ci/inventory/controlled.json --data-dir .cache/f2-ci
      - run: uv run --locked python -m citibike.history verify --inventory .cache/f2-ci/inventory/controlled.json --data-dir .cache/f2-ci --output .cache/f2-ci-evidence.json --report .cache/f2-ci-analysis.md
      - run: uv run --locked python -m citibike.analytics build --data-dir .cache/f2-ci
      - run: uv run --locked python -m citibike.analytics build --data-dir .cache/f2-ci
      - run: uv run --locked python -m tests.integration.analytics_protocol --data-dir .cache/f2-ci
      - run: uv run --locked python -m tests.fixtures_history --data-dir .cache/f2-ci --change-period 2026-04
      - run: uv run --locked python -m citibike.history build --inventory .cache/f2-ci/inventory/controlled.json --data-dir .cache/f2-ci
      - run: uv run --locked python -m tests.integration.history_smoke --data-dir .cache/f2-ci
      - run: uv run --locked python -m citibike.analytics build --data-dir .cache/f2-ci
      - run: uv run --locked python -m tests.integration.analytics_protocol --data-dir .cache/f2-ci --changed
      - run: uv build
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  docker-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
      - run: uv sync --locked --group ml
      - name: Generate ephemeral database password
        run: |
          password=$(uv run --locked python -c 'import secrets; print(secrets.token_hex(24))')
          echo "::add-mask::$password"
          echo "PGPASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: uv run --locked python tests/integration/smoke.py --expect-data empty
      - run: uv run --locked pytest -q tests/integration/test_serving.py tests/integration/test_analytics.py
      - run: uv run --locked --group ml pytest -q tests/integration/test_forecasting.py
      - run: uv run --locked --group ml pytest -q tests/integration/test_risk.py
      - run: uv run --locked --group ml python -m tests.integration.forecast_smoke
      - run: uv run --locked python -m tests.integration.analytics_smoke
      - run: uv run --locked python -m tests.fixtures --output .cache/f1-fixture.zip
      - run: uv run --locked python -m citibike.pipeline --period 2026-04 --fixture .cache/f1-fixture.zip --data-dir .cache/f1
      - run: uv run --locked python tests/integration/smoke.py --expected-count 4
      - run: uv run --locked python tests/integration/smoke.py --expected-count 3 --start-date 2026-04-01 --end-date 2026-04-02
      - run: uv run --locked python tests/integration/smoke.py --expect-data error --start-date 2026-04-02 --end-date 2026-04-01
      - run: docker compose stop api
      - run: uv run --locked python tests/integration/smoke.py --expect-api unavailable --expect-data unavailable
      - run: docker compose up -d --wait --wait-timeout 120
      - run: uv run --locked python tests/integration/smoke.py --expected-count 4
      - run: docker compose stop db
      - run: uv run --locked python tests/integration/smoke.py --expect-data unavailable
      - run: docker compose up -d --wait --wait-timeout 120
      - run: uv run --locked python tests/integration/smoke.py --expected-count 4
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down
