name: bikeflow-staging
services:
  db:
    # Stable tag: application releases/rollbacks must not recreate PostgreSQL.
    image: bikeflow-staging-db:17-patched
    build:
      context: .
      dockerfile: infra/db.Dockerfile
    environment:
      POSTGRES_DB: bikeflow_staging
      POSTGRES_USER: staging_owner
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Run staging init}
    ports: ["127.0.0.1:25432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_owner -d bikeflow_staging"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  api:
    image: bikeflow-staging-api:${RELEASE_ID:?Set release identity}
    build:
      context: .
      dockerfile: infra/api.Dockerfile
      args: {RELEASE_ID: "${RELEASE_ID}"}
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: bikeflow_staging
      PGUSER: bikeflow_reader
      PGPASSWORD: ${STAGING_READER_PASSWORD:?Run staging init}
      BIKEFLOW_API_RATE_PER_MINUTE: "6000"
    ports: ["127.0.0.1:18000:8000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
  web:
    image: bikeflow-staging-web:${RELEASE_ID:?Set release identity}
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args: {RELEASE_ID: "${RELEASE_ID}"}
    environment: {API_BASE_URL: "http://api:8000", HOSTNAME: "0.0.0.0", PORT: "3000"}
    ports: ["127.0.0.1:13000:3000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 30
volumes:
  postgres_data:
